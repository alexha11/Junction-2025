services:
  opcua-server:
    build:
      context: digital-twin/opcua-server
      dockerfile: Dockerfile
    environment:
      SPEEDUP: "900"
    ports:
      - "4840:4840"

  pump-scheduler:
    build:
      context: .
      dockerfile: pump-scheduler/Dockerfile
    depends_on:
      - opcua-server
    environment:
      OPCUA_ENDPOINT: opc.tcp://opcua-server:4840/wastewater/
      OPC_POLL_SECONDS: "0.05"
      ROLLING_STEPS: "192"
      MIN_HISTORY_STEPS: "32"
      REOPTIMIZE_EVERY_SAMPLES: "1"
      COMMAND_MODE: "db"
      DB_PATH: /app/data/scheduler.db
      WEB_PORT: "8090"
    ports:
      - "8090:8090"
    volumes:
      - ./pump-scheduler/data:/app/data

  pump-actuator:
    build:
      context: .
      dockerfile: pump-scheduler/Dockerfile
    depends_on:
      - pump-scheduler
      - opcua-server
    command: ["python", "/app/actuator.py"]
    environment:
      DB_PATH: /app/data/scheduler.db
      ACTUATOR_MODE: "dryrun"
      ACTUATOR_POLL_SECONDS: "0.5"
      COMMAND_OPCUA_ENDPOINT: opc.tcp://opcua-server:4840/wastewater/
      # COMMAND_NODE_MAP: /app/opc_command_node_map.example.json
    volumes:
      - ./pump-scheduler/data:/app/data
